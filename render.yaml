# Render Blueprint - deploy with "New +" -> "Blueprint" in the Render
# dashboard, pointing at the repo/folder containing this file, Dockerfile,
# and render-entrypoint.sh.
#
# After deploying, set the "sync: false" secrets below in the Render
# dashboard (Environment tab) - they are intentionally NOT written here so
# they never end up committed to git.

services:
  - type: web
    name: hermes-agent
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free            # NOTE: free tier sleeps after 15 min idle and
                            # wipes its disk on every sleep/wake cycle -
                            # config regenerates fine (via the entrypoint
                            # script) but in-memory session context is
                            # lost each time. Pinging /health from
                            # UptimeRobot every 5 min should keep it warm
                            # enough in practice to avoid most of that.
                            # Also note free tier has a monthly runtime
                            # hour cap - check your Render account's
                            # current limit if you run other free
                            # services too. Switch to "starter" later if
                            # you see it getting killed/reset under load.
    healthCheckPath: /health
    envVars:
      - key: API_SERVER_ENABLED
        value: "true"
      - key: API_SERVER_HOST
        value: "0.0.0.0"
      - key: API_SERVER_PORT
        value: "8642"
      - key: API_SERVER_KEY
        sync: false        # set a long random value, e.g. output of:
                            # openssl rand -hex 32
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false        # the SERVICE ROLE key, never the anon key
      - key: OPENROUTER_API_KEY
        sync: false        # or whichever model provider you picked with
                            # `hermes model` - variable name depends on
                            # the provider, check `hermes doctor` output
